<?xml version="1.0" encoding="UTF-8"?>
<svg width="100px" height="100px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="image-rendering: -moz-crisp-edges; image-rendering: pixelated;">
    <title>Pixel Tomato</title>
    <g id="Pixel-Tomato" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Darker outline for depth -->
        <path d="M5,9 L5,18 L6,19 L18,19 L19,18 L19,9 L18,8 L6,8 L5,9 Z" id="outline" fill="#D32F2F"></path>
        <!-- Main tomato body -->
        <rect id="body" fill="#F44336" x="6" y="9" width="12" height="9"></rect>
        <!-- Glossy highlight -->
        <path d="M8,11 L11,11 L11,12 L10,12 L10,13 L9,13 L9,12 L8,12 L8,11 Z" id="highlight" fill="#FFCDD2"></path>
        <!-- Cute eyes -->
        <rect id="eye-left" fill="#212121" x="9" y="15" width="2" height="2"></rect>
        <rect id="eye-right" fill="#212121" x="14" y="15" width="2" height="2"></rect>
        <!-- Stem -->
        <path d="M10,5 L10,8 L9,8 L9,9 L15,9 L15,8 L14,8 L14,5 L10,5 Z" id="stem-outline" fill="#388E3C"></path>
        <rect id="stem-main" fill="#4CAF50" x="11" y="6" width="2" height="2"></rect>
    </g>
</svg>
