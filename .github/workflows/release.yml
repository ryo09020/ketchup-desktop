name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release DMG
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build Desktop App & Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'KetchUp Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## KetchUp Desktop ${{ github.ref_name }}
            
            最新の macOS 向けインストーラー（`.dmg`）です。
            
            ---
            
            ## インストール & 初回起動手順 (Installation Guide)
            
            KetchUp は Apple 有料開発者公証を通していない個人開発アプリのため、macOS のセキュリティにより初回起動時に「壊れているため開けません」と表示される場合があります。以下の **3ステップ** で簡単に起動できます。
            
            ---
            
            ### ステップ 1: ダウンロード & アプリの配置
            1. 下の **`Assets`** から `KetchUp_..._aarch64.dmg` をダウンロードして開きます。
            2. 表示されたウィンドウで、**`KetchUp.app`** を **`Applications`（アプリケーション）フォルダ** へドラッグ＆ドロップします。
            
            ---
            
            ### ステップ 2: セキュリティ制限の解除（初回のみ）
            Mac の **ターミナル（Terminal）** アプリを開き、以下のコマンドをコピー＆ペーストして Enter を押してください：
            
            ```bash
            xattr -cr /Applications/KetchUp.app
            ```
            
            ---
            
            ### ステップ 3: 起動
            Launchpad または Applications フォルダから **KetchUp** を開いてください。次回以降はこの操作は不要で、通常どおり起動できます。
          releaseDraft: false
          prerelease: false
