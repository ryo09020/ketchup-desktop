openapi: 3.0.3
info:
  title: KetchUp API
  version: 0.1.0
  description: |
    KetchUp Desktop のバックエンド API。
    このファイルが API の Single Source of Truth であり、
    - Go サーバー: oapi-codegen で型とサーバーインターフェースを生成
    - React クライアント: orval で型付きクライアントを生成
    する (ketch-up と同じ「スキーマ駆動」の流れ)。

    認証: Supabase Auth が発行したアクセストークン (JWT) を
    `Authorization: Bearer <token>` で送る。
    日付 (`date`) はすべてユーザーのタイムゾーン (profile.timezone) 基準の `YYYY-MM-DD`。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

tags:
  - name: me
  - name: tasks
  - name: pomos
  - name: session
  - name: stats
  - name: reports
  - name: ai
  - name: groups

paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }

  # ---------------------------------------------------------------- me
  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: 自分のプロフィールと設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: 更新後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMe
      tags: [me]
      description: アカウントと全データを削除する (App Store 審査ガイドライン 5.1.1(v))
      responses:
        "204": { description: 削除完了 }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/settings:
    put:
      operationId: updateSettings
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: 更新後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- tasks
  /v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - name: includeCompleted
          in: query
          description: true のとき完了済みタスクも返す
          schema: { type: boolean, default: false }
        - name: completedSince
          in: query
          description: includeCompleted=true のとき、この日付以降に完了したものだけ返す
          schema: { type: string, format: date }
      responses:
        "200":
          description: タスク一覧 (sortOrder 昇順)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: 作成されたタスク
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tasks/reorder:
    post:
      operationId: reorderTasks
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  description: 新しい表示順に並べたタスクID
                  items: { type: string, format: uuid }
      responses:
        "204": { description: OK }
        default: { $ref: "#/components/responses/Error" }

  /v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      operationId: updateTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: 更新後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTask
      tags: [tasks]
      responses:
        "204": { description: 削除完了 }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- pomos
  /v1/pomos:
    get:
      operationId: listPomos
      tags: [pomos]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: 期間内のポモドーロ (startedAt 昇順)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pomo" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPomo
      tags: [pomos]
      description: 完了したポモドーロを記録。clientId で冪等 (オフライン再送対応)。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePomoRequest" }
      responses:
        "201":
          description: 記録 (既存 clientId の場合は既存レコード)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pomo" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- session
  /v1/session:
    put:
      operationId: putSession
      tags: [session]
      description: 現在のタイマー状態を公開 (グループメンバーに Realtime 配信される)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutSessionRequest" }
      responses:
        "200":
          description: 保存後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- stats
  /v1/stats/daily:
    get:
      operationId: getDailyStats
      tags: [stats]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: 日別集計 (データのある日のみ, date 昇順)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyStat" }
        default: { $ref: "#/components/responses/Error" }

  /v1/stats/tasks:
    get:
      operationId: getTaskStats
      tags: [stats]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: タスク別集計 (pomoCount 降順)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskStat" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- reports
  /v1/reports:
    get:
      operationId: listReports
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: 期間内の自分の日報 (publishedDate 昇順)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        default: { $ref: "#/components/responses/Error" }

  /v1/reports/{date}:
    parameters:
      - $ref: "#/components/parameters/DatePath"
    get:
      operationId: getReport
      tags: [reports]
      responses:
        "200":
          description: 日報
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: upsertReport
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertReportRequest" }
      responses:
        "200":
          description: 保存後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReport
      tags: [reports]
      responses:
        "204": { description: 削除完了 }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- ai / voice
  /v1/ai/voice-report:
    post:
      operationId: createVoiceReportDraft
      tags: [ai]
      description: |
        録音した音声から日報の下書きを生成する。
        音声は文字起こし後ただちに破棄され、保存されるのは文字起こしテキストのみ。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, date]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 音声ファイル (audio/mp4, audio/webm, audio/wav 等, 最大 20MB)
                date:
                  type: string
                  format: date
                durationSec:
                  type: integer
      responses:
        "200":
          description: 生成結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceReportDraft" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/ai/summaries:
    get:
      operationId: listAiSummaries
      tags: [ai]
      parameters:
        - name: scope
          in: query
          schema: { $ref: "#/components/schemas/SummaryScope" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: 期間が [from, to] と重なる AI まとめ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: generateAiSummary
      tags: [ai]
      description: AI まとめを生成 (同じ期間の既存まとめは上書き)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSummaryRequest" }
      responses:
        "200":
          description: 生成結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSummary" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- groups
  /v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      responses:
        "200":
          description: 所属グループ一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: 作成されたグループ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        default: { $ref: "#/components/responses/Error" }

  /v1/groups/join:
    post:
      operationId: joinGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode: { type: string }
      responses:
        "200":
          description: 参加したグループ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        default: { $ref: "#/components/responses/Error" }

  /v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      tags: [groups]
      responses:
        "200":
          description: グループ詳細 (メンバーと現在のタイマー状態を含む)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: 更新後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGroup
      tags: [groups]
      responses:
        "204": { description: 削除完了 }
        default: { $ref: "#/components/responses/Error" }

  /v1/groups/{groupId}/invite-code:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: rotateInviteCode
      tags: [groups]
      description: 招待コードを再発行 (オーナーのみ)
      responses:
        "200":
          description: 更新後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        default: { $ref: "#/components/responses/Error" }

  /v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: addGroupMember
      tags: [groups]
      description: メールアドレスで登録済みユーザーを追加 (オーナーのみ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: 更新後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        default: { $ref: "#/components/responses/Error" }

  /v1/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeGroupMember
      tags: [groups]
      description: 自分自身なら脱退、オーナーなら他メンバーを削除。オーナー自身は脱退不可 (グループ削除を使う)。
      responses:
        "204": { description: OK }
        default: { $ref: "#/components/responses/Error" }

  /v1/groups/{groupId}/reports:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listGroupReports
      tags: [groups]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: 指定日のメンバーの日報
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupReport" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DatePath:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    From:
      name: from
      in: query
      required: true
      description: 開始日 (含む)
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      description: 終了日 (含む)
      schema: { type: string, format: date }

  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械可読なエラーコード (e.g. not_found, forbidden, validation, rate_limited)
        message:
          type: string
          description: 人間向けメッセージ (日本語)

    # ---------------- me
    Profile:
      type: object
      required: [id, displayName, timezone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        timezone: { type: string, example: Asia/Tokyo }
    Settings:
      type: object
      required:
        [focusSec, shortBreakSec, longBreakSec, longBreakInterval, autoStartBreaks, autoStartFocus]
      properties:
        focusSec: { type: integer, minimum: 60, maximum: 7200, example: 1500 }
        shortBreakSec: { type: integer, minimum: 60, maximum: 3600, example: 300 }
        longBreakSec: { type: integer, minimum: 60, maximum: 7200, example: 900 }
        longBreakInterval: { type: integer, minimum: 1, maximum: 12, example: 4 }
        autoStartBreaks: { type: boolean }
        autoStartFocus: { type: boolean }
    Me:
      type: object
      required: [profile, settings]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        settings: { $ref: "#/components/schemas/Settings" }
    UpdateMeRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        timezone: { type: string }

    # ---------------- tasks
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, COMPLETED]
    Task:
      type: object
      required:
        [id, title, note, status, estimatedPomos, actualPomos, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        note: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        estimatedPomos: { type: integer }
        actualPomos: { type: integer, description: このタスクで完了したポモ数 }
        dueDate: { type: string, format: date, nullable: true }
        project: { type: string, nullable: true }
        sortOrder: { type: number, format: double }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string }
        estimatedPomos: { type: integer, minimum: 0, maximum: 50 }
        dueDate: { type: string, format: date, nullable: true }
        project: { type: string, nullable: true, maxLength: 50 }
    UpdateTaskRequest:
      type: object
      description: 指定したフィールドのみ更新。dueDate/project を消すには clearDueDate/clearProject を true に。
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        estimatedPomos: { type: integer, minimum: 0, maximum: 50 }
        dueDate: { type: string, format: date }
        clearDueDate: { type: boolean }
        project: { type: string, maxLength: 50 }
        clearProject: { type: boolean }

    # ---------------- pomos
    Pomo:
      type: object
      required: [id, startedAt, endedAt, durationSec]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationSec: { type: integer }
    CreatePomoRequest:
      type: object
      required: [clientId, startedAt, endedAt, durationSec]
      properties:
        clientId: { type: string, format: uuid }
        taskId: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationSec: { type: integer, minimum: 1 }

    # ---------------- session
    SessionPhase:
      type: string
      enum: [IDLE, FOCUS, PAUSED, SHORT_BREAK, LONG_BREAK]
    Session:
      type: object
      required: [userId, phase, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        phase: { $ref: "#/components/schemas/SessionPhase" }
        taskId: { type: string, format: uuid, nullable: true }
        taskTitle: { type: string, nullable: true }
        phaseEndsAt: { type: string, format: date-time, nullable: true }
        remainingSec: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time }
    PutSessionRequest:
      type: object
      required: [phase]
      properties:
        phase: { $ref: "#/components/schemas/SessionPhase" }
        taskId: { type: string, format: uuid, nullable: true }
        taskTitle: { type: string, nullable: true }
        phaseEndsAt: { type: string, format: date-time, nullable: true }
        remainingSec: { type: integer, nullable: true }

    # ---------------- stats
    DailyStat:
      type: object
      required: [date, pomoCount, focusSec]
      properties:
        date: { type: string, format: date }
        pomoCount: { type: integer }
        focusSec: { type: integer }
        selfScore: { type: integer, nullable: true, description: その日の日報の自己評価 }
        hasReport: { type: boolean }
    TaskStat:
      type: object
      required: [title, pomoCount, focusSec]
      properties:
        taskId: { type: string, format: uuid, nullable: true }
        title: { type: string, description: 削除済み/タスクなしの場合は "(タスクなし)" }
        pomoCount: { type: integer }
        focusSec: { type: integer }

    # ---------------- reports
    ReportSource:
      type: string
      enum: [manual, voice, ai]
    Report:
      type: object
      required: [id, publishedDate, body, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        publishedDate: { type: string, format: date }
        body: { type: string }
        selfScore: { type: integer, nullable: true, minimum: 1, maximum: 100 }
        source: { $ref: "#/components/schemas/ReportSource" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpsertReportRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        selfScore: { type: integer, nullable: true, minimum: 1, maximum: 100 }
        source: { $ref: "#/components/schemas/ReportSource" }

    # ---------------- ai
    VoiceReportDraft:
      type: object
      required: [transcript, draft, model]
      properties:
        voiceNoteId: { type: string, format: uuid }
        transcript: { type: string, description: 文字起こし全文 }
        draft: { type: string, description: 日報テンプレート形式の Markdown 下書き }
        model: { type: string }
    SummaryScope:
      type: string
      enum: [daily, weekly, monthly]
    GenerateSummaryRequest:
      type: object
      required: [scope, periodStart, periodEnd]
      properties:
        scope: { $ref: "#/components/schemas/SummaryScope" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
    AiSummary:
      type: object
      required: [id, scope, periodStart, periodEnd, content, model, createdAt]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/SummaryScope" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        content: { type: string, description: Markdown }
        model: { type: string }
        createdAt: { type: string, format: date-time }

    # ---------------- groups
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, maxLength: 500 }
    GroupSummary:
      type: object
      required: [id, name, description, memberCount, isOwner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        activeCount: { type: integer, description: 現在集中中のメンバー数 }
        isOwner: { type: boolean }
    GroupMember:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
        session: { $ref: "#/components/schemas/Session" }
        todayPomoCount: { type: integer }
    GroupDetail:
      type: object
      required: [id, name, description, ownerId, isOwner, members, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string, format: uuid }
        isOwner: { type: boolean }
        inviteCode: { type: string, nullable: true, description: オーナーとメンバーに返す }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        createdAt: { type: string, format: date-time }
    GroupReport:
      type: object
      required: [user, report]
      properties:
        user:
          type: object
          required: [userId, displayName]
          properties:
            userId: { type: string, format: uuid }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }
        report: { $ref: "#/components/schemas/Report" }
        pomoCount: { type: integer }
